<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Casino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@400;600;700&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #1a2e1a 0%, #081208 100%);
      min-height: 100vh;
      color: #fff;
      user-select: none;
    }

    .font-serif-title {
      font-family: 'Cinzel', serif;
    }

    /* Casino Felt Texture & Border */
    .poker-table {
      background: radial-gradient(ellipse at center, #1b4d24 0%, #0d2b13 70%, #06170a 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.9);
      border: 14px solid #3d2314;
      border-radius: 120px;
    }

    @media (max-width: 768px) {
      .poker-table {
        border-width: 8px;
        border-radius: 40px;
      }
    }

    /* Card Animations */
    .card-container {
      perspective: 1000px;
    }

    .card-deal-anim {
      animation: dealCard 0.4s ease-out forwards;
    }

    @keyframes dealCard {
      0% {
        opacity: 0;
        transform: translateY(-150px) rotate(-10deg) scale(0.5);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    /* Chip Styling */
    .chip {
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
      transition: all 0.2s ease;
    }
    .chip:hover:not(:disabled) {
      transform: translateY(-6px) scale(1.08);
    }
    .chip:active:not(:disabled) {
      transform: translateY(-2px) scale(0.98);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.4);
      border-radius: 3px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-2 md:p-6 min-h-screen">

  <!-- Header -->
  <header class="w-full max-w-5xl flex justify-between items-center py-2 px-4 border-b border-amber-500/20">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-crown text-amber-400 text-2xl md:text-3xl"></i>
      <h1 class="font-serif-title text-xl md:text-3xl font-bold tracking-wider text-amber-300">
        ROYAL BLACKJACK
      </h1>
    </div>
    <div class="flex items-center gap-4 text-xs md:text-sm">
      <div class="bg-black/40 px-3 py-1.5 rounded-full border border-amber-500/30">
        <span class="text-gray-400">Guthaben:</span>
        <span id="bankrollDisplay" class="font-bold text-amber-400 ml-1">$1,000</span>
      </div>
      <button onclick="toggleAudio()" id="audioBtn" class="text-gray-400 hover:text-white p-2 transition">
        <i class="fa-solid fa-volume-high text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Felt Table -->
  <main class="w-full max-w-5xl my-auto p-4 md:p-8">
    <div class="poker-table relative flex flex-col justify-between min-h-[480px] md:min-h-[540px] p-4 md:p-8 border-amber-900/60">
      
      <!-- Table Watermark / Rules -->
      <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-10">
        <div class="font-serif-title text-4xl md:text-6xl font-black text-amber-200 tracking-widest text-center">
          BLACKJACK<br>PAYS 3 TO 2
        </div>
        <div class="text-xs md:text-sm font-semibold tracking-wider text-white mt-2">
          Dealer must draw to 16 and stand on all 17s
        </div>
      </div>

      <!-- Dealer Area -->
      <div class="relative z-10 flex flex-col items-center">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs md:text-sm uppercase tracking-widest text-amber-200/80 font-semibold">Dealer</span>
          <span id="dealerScore" class="bg-black/60 text-amber-300 text-xs font-bold px-2.5 py-0.5 rounded-full border border-amber-500/30 hidden">0</span>
        </div>
        <div id="dealerCards" class="flex justify-center items-center -space-x-8 md:-space-x-12 min-h-[110px] md:min-h-[140px]">
          <!-- Dealer Cards populate here -->
        </div>
      </div>

      <!-- Center Status / Outcome Banner -->
      <div class="relative z-20 my-4 text-center min-h-[50px] flex items-center justify-center">
        <div id="statusBanner" class="hidden transform transition-all duration-300 px-6 py-2 rounded-full font-serif-title font-bold text-lg md:text-2xl shadow-2xl border">
          <!-- Status Text -->
        </div>
      </div>

      <!-- Player Area -->
      <div class="relative z-10 flex flex-col items-center">
        <div id="playerCards" class="flex justify-center items-center -space-x-8 md:-space-x-12 min-h-[110px] md:min-h-[140px]">
          <!-- Player Cards populate here -->
        </div>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-xs md:text-sm uppercase tracking-widest text-amber-200/80 font-semibold">Spieler</span>
          <span id="playerScore" class="bg-black/60 text-amber-300 text-xs font-bold px-2.5 py-0.5 rounded-full border border-amber-500/30 hidden">0</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom Control Panel -->
  <footer class="w-full max-w-4xl bg-black/60 backdrop-blur-md border border-amber-500/20 rounded-2xl p-3 md:p-5 shadow-2xl mb-2">
    
    <!-- Betting Section -->
    <div id="bettingControls" class="flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400 uppercase tracking-wider">Einsatz:</span>
        <span id="currentBetDisplay" class="font-bold text-amber-400 text-lg md:text-xl">$0</span>
      </div>

      <!-- Chips Selection -->
      <div class="flex items-center gap-2 md:gap-4">
        <button onclick="addBet(5)" class="chip w-11 h-11 md:w-14 md:h-14 rounded-full bg-red-700 border-4 border-dashed border-white/80 font-bold text-xs md:text-sm flex items-center justify-center">$5</button>
        <button onclick="addBet(25)" class="chip w-11 h-11 md:w-14 md:h-14 rounded-full bg-green-700 border-4 border-dashed border-white/80 font-bold text-xs md:text-sm flex items-center justify-center">$25</button>
        <button onclick="addBet(100)" class="chip w-11 h-11 md:w-14 md:h-14 rounded-full bg-black border-4 border-dashed border-amber-400 font-bold text-xs md:text-sm text-amber-400 flex items-center justify-center">$100</button>
        <button onclick="addBet(500)" class="chip w-11 h-11 md:w-14 md:h-14 rounded-full bg-purple-800 border-4 border-dashed border-white/80 font-bold text-xs md:text-sm flex items-center justify-center">$500</button>
      </div>

      <!-- Action Buttons for Betting -->
      <div class="flex gap-2 w-full md:w-auto">
        <button onclick="clearBet()" class="flex-1 md:flex-none px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl font-semibold text-xs md:text-sm transition border border-gray-600">
          Löschen
        </button>
        <button onclick="startGame()" id="dealBtn" disabled class="flex-1 md:flex-none px-6 py-2 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-black font-bold text-xs md:text-sm rounded-xl transition shadow-lg disabled:opacity-40 disabled:cursor-not-allowed">
          Geben (Deal)
        </button>
      </div>
    </div>

    <!-- Gameplay Actions Section -->
    <div id="actionControls" class="hidden flex flex-wrap items-center justify-center gap-3">
      <button onclick="hit()" class="flex-1 max-w-[140px] py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold rounded-xl shadow-lg border border-emerald-400/30 transition flex items-center justify-center gap-2 text-sm md:text-base">
        <i class="fa-solid fa-plus"></i> Karte (Hit)
      </button>
      <button onclick="stand()" class="flex-1 max-w-[140px] py-3 bg-rose-700 hover:bg-rose-600 active:scale-95 text-white font-bold rounded-xl shadow-lg border border-rose-400/30 transition flex items-center justify-center gap-2 text-sm md:text-base">
        <i class="fa-solid fa-hand"></i> Halten (Stand)
      </button>
      <button id="doubleBtn" onclick="doubleDown()" class="flex-1 max-w-[140px] py-3 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold rounded-xl shadow-lg border border-amber-400/30 transition flex items-center justify-center gap-2 text-sm md:text-base disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-angles-up"></i> Verdoppeln
      </button>
    </div>

    <!-- Game Reset Controls -->
    <div id="resetControls" class="hidden flex items-center justify-center gap-4">
      <button onclick="resetForNewRound()" class="px-8 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-black font-bold text-sm md:text-base rounded-xl shadow-xl transition active:scale-95">
        <i class="fa-solid fa-rotate-right mr-2"></i>Nächste Runde
      </button>
    </div>

  </footer>

  <!-- Audio Synthetic Generator & Logic -->
  <script>
    // Audio Context Setup
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'card') {
        // Soft click sound for card dealing
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'chip') {
        // High click for chips
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'win') {
        // Pleasant chord for win
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.15, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
          o.start(now + i * 0.08);
          o.stop(now + i * 0.08 + 0.4);
        });
      } else if (type === 'lose') {
        // Low tone for loss
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audioBtn');
      btn.innerHTML = audioEnabled 
        ? '<i class="fa-solid fa-volume-high text-lg"></i>' 
        : '<i class="fa-solid fa-volume-xmark text-lg text-rose-400"></i>';
    }

    const suits = [
      { symbol: '♥', color: 'text-red-600', name: 'Herz' },
      { symbol: '♦', color: 'text-red-600', name: 'Karo' },
      { symbol: '♣', color: 'text-slate-900', name: 'Kreuz' },
      { symbol: '♠', color: 'text-slate-900', name: 'Pik' }
    ];

    const cardDefinitions = [
      { name: '2', value: 2 },
      { name: '3', value: 3 },
      { name: '4', value: 4 },
      { name: '5', value: 5 },
      { name: '6', value: 6 },
      { name: '7', value: 7 },
      { name: '8', value: 8 },
      { name: '9', value: 9 },
      { name: '10', value: 10 },
      { name: 'J', value: 10, label: 'Bube' },
      { name: 'Q', value: 10, label: 'Dame' },
      { name: 'K', value: 10, label: 'König' },
      { name: 'A', value: 11, label: 'Ass' }
    ];

    // Game Variables
    let deck = [];
    let playerHand = [];
    let dealerHand = [];
    let bankroll = 1000;
    let currentBet = 0;
    let gameActive = false;

    function buildDeck() {
      deck = [];
      for (let s of suits) {
        for (let c of cardDefinitions) {
          deck.push({ ...c, suit: s });
        }
      }
      // Shuffle deck
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 3));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function addBet(amount) {
      if (gameActive) return;
      if (bankroll >= amount) {
        bankroll -= amount;
        currentBet += amount;
        playSound('chip');
        updateUI();
      }
    }

    function clearBet() {
      if (gameActive) return;
      bankroll += currentBet;
      currentBet = 0;
      playSound('chip');
      updateUI();
    }

    function calculateScore(hand) {
      let score = 0;
      let aces = 0;

      for (let card of hand) {
        score += card.value;
        if (card.name === 'A') aces++;
      }

      while (score > 21 && aces > 0) {
        score -= 10;
        aces--;
      }

      return score;
    }

    function startGame() {
      if (currentBet === 0 || gameActive) return;

      gameActive = true;
      buildDeck();
      playerHand = [];
      dealerHand = [];

      // Deal initial cards
      playerHand.push(deck.pop());
      dealerHand.push(deck.pop());
      playerHand.push(deck.pop());
      dealerHand.push(deck.pop()); // Second dealer card (hidden at start)

      playSound('card');

      // Update Controls Display
      document.getElementById('bettingControls').classList.add('hidden');
      document.getElementById('actionControls').classList.remove('hidden');
      document.getElementById('resetControls').classList.add('hidden');
      document.getElementById('statusBanner').classList.add('hidden');

      // Check for Double Down availability
      document.getElementById('doubleBtn').disabled = bankroll < currentBet;

      renderHands(false);
      updateScores(false);

      // Check for immediate Blackjack
      const playerScore = calculateScore(playerHand);
      if (playerScore === 21) {
        stand();

      }
    }

    function hit() {
      if (!gameActive) return;

      playerHand.push(deck.pop());
      playSound('card');
      
      document.getElementById('doubleBtn').disabled = true; // Double only allowed on first move

      renderHands(false);
      const score = calculateScore(playerHand);
      updateScores(false);

      if (score >= 21) {
        stand();
      }
    }

    function doubleDown() {
      if (!gameActive || bankroll < currentBet) return;

      bankroll -= currentBet;
      currentBet *= 2;
      playSound('chip');
      
      playerHand.push(deck.pop());
      playSound('card');

      renderHands(false);
      updateScores(false);

      stand();
    }

    function stand() {
      if (!gameActive) return;

      // Reveal dealer's hidden card and execute dealer AI
      let dealerScore = calculateScore(dealerHand);

      // Dealer draws until 17 or higher
      while (dealerScore < 17 && calculateScore(playerHand) <= 21) {
        dealerHand.push(deck.pop());
        dealerScore = calculateScore(dealerHand);
      }

      renderHands(true);
      updateScores(true);
      evaluateOutcome();
    }

    function evaluateOutcome() {
      gameActive = false;
      const playerScore = calculateScore(playerHand);
      const dealerScore = calculateScore(dealerHand);

      const isPlayerBJ = playerScore === 21 && playerHand.length === 2;
      const isDealerBJ = dealerScore === 21 && dealerHand.length === 2;

      let bannerText = "";
      let bannerStyle = "";
      let soundToPlay = "";

      if (playerScore > 21) {
        bannerText = "BUST! Überkauft";
        bannerStyle = "bg-rose-950/90 text-rose-300 border-rose-500/50";
        soundToPlay = 'lose';
      } else if (dealerScore > 21) {
        const payout = currentBet * 2;
        bankroll += payout;
        bannerText = `DEALER BUST! Du gewinnst +$${payout}`;
        bannerStyle = "bg-emerald-950/90 text-emerald-300 border-emerald-500/50";
        soundToPlay = 'win';
      } else if (isPlayerBJ && !isDealerBJ) {
        const payout = currentBet + (currentBet * 1.5);
        bankroll += payout;
        bannerText = `BLACKJACK! Du gewinnst +$${payout * 1.5}`;
        bannerStyle = "bg-amber-950/90 text-amber-300 border-amber-400/60";
        soundToPlay = 'win';
      } else if (playerScore > dealerScore) {
        const payout = currentBet * 2;
        bankroll += payout;
        bannerText = `SIEG! Du gewinnst +$${payout}`;
        bannerStyle = "bg-emerald-950/90 text-emerald-300 border-emerald-500/50";
        soundToPlay = 'win';
      } else if (playerScore < dealerScore) {
        bannerText = "NIDERLAGE! Dealer gewinnt";
        bannerStyle = "bg-rose-950/90 text-rose-300 border-rose-500/50";
        soundToPlay = 'lose';
      } else {
        // Push (Unentschieden)
        bankroll += currentBet;
        bannerText = "PUSH! Unentschieden";
        bannerStyle = "bg-slate-800/90 text-amber-200 border-slate-500/50";
        soundToPlay = 'chip';
      }

      playSound(soundToPlay);
      showStatus(bannerText, bannerStyle);

      // Show reset button
      document.getElementById('actionControls').classList.add('hidden');
      document.getElementById('resetControls').classList.remove('hidden');
      updateUI();
    }

    function showStatus(text, styleClasses) {
      const banner = document.getElementById('statusBanner');
      banner.className = `transform transition-all duration-300 px-6 py-2 rounded-full font-serif-title font-bold text-lg md:text-2xl shadow-2xl border ${styleClasses}`;
      banner.textContent = text;
      banner.classList.remove('hidden');
    }

    function resetForNewRound() {
      currentBet = 0;
      playerHand = [];
      dealerHand = [];

      document.getElementById('dealerCards').innerHTML = '';
      document.getElementById('playerCards').innerHTML = '';
      document.getElementById('dealerScore').classList.add('hidden');
      document.getElementById('playerScore').classList.add('hidden');
      document.getElementById('statusBanner').classList.add('hidden');

      document.getElementById('resetControls').classList.add('hidden');
      document.getElementById('bettingControls').classList.remove('hidden');

      // Auto refill bankroll if bankrupt
      if (bankroll < 5) {
        bankroll = 1000;
      }

      updateUI();
    }

    function createCardElement(card, isHidden = false) {
      const cardDiv = document.createElement('div');
      cardDiv.className = 'card-container card-deal-anim w-20 h-28 md:w-24 md:h-36 rounded-xl shadow-2xl relative select-none';

      if (isHidden) {
        cardDiv.innerHTML = `
          <div class="w-full h-full bg-blue-900 border-2 border-white rounded-xl p-1 shadow-inner flex items-center justify-center">
            <div class="w-full h-full border border-amber-400/40 rounded-lg bg-gradient-to-br from-blue-800 to-indigo-950 flex items-center justify-center">
              <i class="fa-solid fa-crown text-amber-400/60 text-2xl"></i>
            </div>
          </div>
        `;
      } else {
        cardDiv.innerHTML = `
          <div class="w-full h-full bg-white border-2 border-gray-200 rounded-xl p-1.5 md:p-2 flex flex-col justify-between ${card.suit.color} shadow-lg">
            <div class="text-left leading-none font-bold text-sm md:text-base">
              ${card.name}<br><span class="text-xs md:text-sm">${card.suit.symbol}</span>
            </div>
            <div class="text-center text-2xl md:text-4xl my-auto">
              ${card.suit.symbol}
            </div>
            <div class="text-right leading-none font-bold text-sm md:text-base transform rotate-180">
              ${card.name}<br><span class="text-xs md:text-sm">${card.suit.symbol}</span>
            </div>
          </div>
        `;
      }
      return cardDiv;
    }

    function renderHands(revealDealer = false) {
      const dealerContainer = document.getElementById('dealerCards');
      const playerContainer = document.getElementById('playerCards');

      dealerContainer.innerHTML = '';
      playerContainer.innerHTML = '';

      dealerHand.forEach((card, index) => {
        const isHidden = (index === 1 && !revealDealer);
        dealerContainer.appendChild(createCardElement(card, isHidden));
      });

      playerHand.forEach((card) => {
        playerContainer.appendChild(createCardElement(card, false));
      });
    }

    function updateScores(revealDealer = false) {
      const pScoreElem = document.getElementById('playerScore');
      const dScoreElem = document.getElementById('dealerScore');

      pScoreElem.textContent = calculateScore(playerHand);
      pScoreElem.classList.remove('hidden');

      if (revealDealer) {
        dScoreElem.textContent = calculateScore(dealerHand);
        dScoreElem.classList.remove('hidden');
      } else {
        dScoreElem.textContent = dealerHand.length > 0 ? dealerHand[0].value : 0;
        dScoreElem.classList.remove('hidden');
      }
    }

    function updateUI() {
      document.getElementById('bankrollDisplay').textContent = `$${bankroll.toLocaleString()}`;
      document.getElementById('currentBetDisplay').textContent = `$${currentBet.toLocaleString()}`;
      document.getElementById('dealBtn').disabled = currentBet === 0;
    }

    // Initialize UI on load
    updateUI();
  </script>
</body>
</html>
