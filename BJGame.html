<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guthaben Verwalten</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #333;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .input-group {
            margin: 20px 0;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #444;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .btn-save {
            background-color: #28a745;
        }

            .btn-save:hover {
                background-color: #218838;
            }

        .btn-reset {
            background-color: #dc3545;
        }

            .btn-reset:hover {
                background-color: #c82333;
            }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #28a745;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Guthaben-Manager</h1>

        <p>Aktueller Stand: <strong><span id="current-balance">100</span> Münzen</strong></p>

        <div class="input-group">
            <label for="new-balance">Neuen Wert festlegen:</label>
            <input type="number" id="new-balance" placeholder="z. B. 500" min="0">
        </div>

        <div class="btn-group">
            <button class="btn-save" id="save-btn">Speichern</button>
            <button class="btn-reset" id="reset-btn">Reset (100)</button>
        </div>

        <p id="status"></p>
    </div>

    <script>
                // DOM-Elemente
                const currentBalanceDisplay = document.getElementById('current-balance');
                const newBalanceInput = document.getElementById('new-balance');
                const saveBtn = document.getElementById('save-btn');
                const resetBtn = document.getElementById('reset-btn');
                const statusDisplay = document.getElementById('status');

                // Funktion: Liest 'globalBalance' aus dem localStorage und zeigt ihn an
                function loadBalance() {
                    let balance = parseInt(localStorage.getItem('globalBalance'));
                    if (isNaN(balance)) {
                        balance = 100; // Standardwert
                    }
                    currentBalanceDisplay.textContent = balance;
                }

                // Funktion: Speichert einen neuen Wert in 'globalBalance'
                function setBalance(newValue) {
                    localStorage.setItem('globalBalance', newValue);
                    loadBalance();
                    showStatus(`Guthaben auf ${newValue} gesetzt!`);
                }

                // Statusmeldung für den Benutzer
                function showStatus(msg) {
                    statusDisplay.textContent = msg;
                    setTimeout(() => {
                        statusDisplay.textContent = '';
                    }, 3000);
                }

                // Event-Listener: Speichern-Button
                saveBtn.addEventListener('click', () => {
                    const inputValue = parseInt(newBalanceInput.value);
                    if (!isNaN(inputValue) && inputValue >= 0) {
                        setBalance(inputValue);
                        newBalanceInput.value = '';
                    } else {
                        showStatus("Bitte eine gültige Zahl eingeben!");
                    }
                });

                // Event-Listener: Reset-Button
                resetBtn.addEventListener('click', () => {
                    setBalance(100);
                });

                // Automatische Aktualisierung, falls der Wert in einem anderen Tab geändert wird
                window.addEventListener('storage', (event) => {
                    if (event.key === 'globalBalance') {
                        loadBalance();
                    }
                });

                // Beim ersten Laden den aktuellen Wert anzeigen
                loadBalance();
    </script>

</body>
</html>
