<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankroll Manager</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            min-height: 100vh;
        }

        .font-serif-title {
            font-family: 'Cinzel', serif;
        }

        .glow-box {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.15);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 text-white">

    <!-- Hauptkarte -->
    <div class="card bg-gray-900/80 backdrop-blur-md border border-amber-500/30 rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl glow-box text-center relative overflow-hidden">

        <!-- Deko-Elemente im Hintergrund -->
        <div class="absolute -right-8 -top-8 w-28 h-28 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -left-8 -bottom-8 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Titel & Header -->
        <div class="flex items-center justify-center gap-3 mb-6">
            <i class="fa-solid fa-wallet text-amber-400 text-3xl"></i>
            <h2 class="font-serif-title text-2xl md:text-3xl font-bold text-amber-300 tracking-wider">
                BANKROLL
            </h2>
        </div>

        <!-- Live-Anzeige der Bankroll -->
        <div class="my-6 p-5 bg-gradient-to-r from-emerald-950/80 to-green-900/80 border border-emerald-500/40 rounded-xl shadow-inner">
            <span class="text-xs uppercase tracking-widest text-emerald-300/70 font-semibold block mb-1">
                Aktuelles Guthaben
            </span>
            <div class="text-3xl md:text-4xl font-extrabold text-emerald-400 tracking-tight" id="bankrollDisplay">
                0,00 €
            </div>
        </div>

        <!-- Eingabefeld zur Anpassung -->
        <div class="space-y-2 text-left mb-8">
            <label for="bankrollInput" class="text-xs text-gray-400 font-medium tracking-wide flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square text-amber-400"></i> Guthaben anpassen:
            </label>
            <div class="relative">
                <input type="number" id="bankrollInput" step="1" placeholder="z. B. 1000"
                       class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-4 py-3 text-amber-300 font-bold focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder-gray-600">
            </div>
        </div>

        <!-- Verlinkung zum Blackjack Casino -->
        <a href="index.html"
           class="w-full inline-flex items-center justify-center gap-3 py-3.5 px-6 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-black font-bold rounded-xl shadow-lg transition transform active:scale-95 text-sm md:text-base">
            <i class="fa-solid fa-dice text-lg"></i>
            Zum Menü zurück
        </a>

    </div>

    <!-- JavaScript Sync Logic -->
    <script>
                const bankrollDisplay = document.getElementById('bankrollDisplay');
                const bankrollInput = document.getElementById('bankrollInput');

                // Funktion zum Formatieren und Anzeigen der Bankroll
                function updateBankrollUI(val) {
                    const numericValue = parseFloat(val);
                    if (isNaN(numericValue) || val === '' || val === null) {
                        bankrollDisplay.textContent = '0,00 €';
                        bankrollInput.value = '';
                    } else {
                        bankrollDisplay.textContent = numericValue.toLocaleString('de-DE', {
                            style: 'currency',
                            currency: 'EUR'
                        });
                        bankrollInput.value = numericValue;
                    }
                }

                // 1. Beim Laden der Seite: Gespeicherten 'bankroll'-Wert aus localStorage abrufen
                const savedBankroll = localStorage.getItem('bankroll');
                updateBankrollUI(savedBankroll !== null ? savedBankroll : 1000);

                // 2. Speicher-Event für synchrone Updates aus anderen Tabs/Seiten
                window.addEventListener('storage', (event) => {
                    if (event.key === 'bankroll') {
                        updateBankrollUI(event.newValue);
                    }
                });

                // 3. Änderungen in diesem Feld speichern & an andere Tabs senden
                bankrollInput.addEventListener('input', (e) => {
                    const newValue = e.target.value;
                    localStorage.setItem('bankroll', newValue);
                    updateBankrollUI(newValue);
                });
    </script>

</body>
</html>
