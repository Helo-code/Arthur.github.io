<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJWeB</title>
    <style>
        /* Modernes Dark-Casino Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a2a22 0%, #0d1310 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            color: #f1c40f; /* Goldener Casino-Look */
            text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Styling der Absende-Buttons */
        input[type="submit"] {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #27ae60, #1e8449);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

            input[type="submit"]:hover {
                background: linear-gradient(135deg, #2ecc71, #27ae60);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(39, 174, 96, 0.5);
            }

        /* Alternativer Look für den Optionen-Button */
        .btn-secondary input[type="submit"] {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

            .btn-secondary input[type="submit"]:hover {
                background: linear-gradient(135deg, #718096, #4a5568);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            }
    </style>
</head>
<body>

    <main class="card-container">
        <h1>Willkommen zu BBLGAME</h1>

        <nav>
            <form action="BJGame.html" method="get">
                <input type="submit" value="Einzahlen" />
            </form>

            <form action="blackjack_casino.html" method="get" class="btn-secondary">
                <input type="submit" value="BlackJack" />
            </form>

            <form action="Slots.html" method="get" class="btn-secondary">
                <input type="submit" value="BabaSlots" />
            </form>
            <form action="leslot.html" method="get" class="btn-secondary">
                <input type="submit" value="LeSlots" />
            </form>
        </nav>
    </main>

</body>
</html>
